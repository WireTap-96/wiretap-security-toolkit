[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiretap-security-toolkit"
version = "0.1.0"
description = "Scope-limited utilities for authorized private-network and Wi-Fi security reviews"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
netscout = "wiretap_security.netscout:main"
servicewalk = "wiretap_security.servicewalk:main"
wifiaudit = "wiretap_security.wifiaudit:main"

[tool.setuptools.packages.find]
include = ["wiretap_security*"]
